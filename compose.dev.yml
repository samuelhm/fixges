# Override de DESARROLLO.
#   docker compose --env-file .env.dev -f compose.yml -f compose.dev.yml up --build
#
# Incluye hot reload del backend (dotnet watch) y puertos accesibles desde el host.

name: fixges-dev

services:
  db:
    ports:
      # Solo accesible desde localhost, para psql/DBeaver.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./backend:/src
      # Volúmenes para no ensuciar el árbol de trabajo ni perder la caché de NuGet.
      - backend_obj:/src/Fixges.Api/obj
      - backend_bin:/src/Fixges.Api/bin
      - nuget_cache:/root/.nuget/packages

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # Cambios en el HTML y en la configuración de nginx sin reconstruir la imagen.
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_obj:
  backend_bin:
  nuget_cache:
